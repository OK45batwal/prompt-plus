name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Run ESLint
        run: npm run lint
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Run Vitest Suite
        run: npm test
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"

      - name: Build Next.js Application
        run: npm run build
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          AUTH_SECRET: "ci-secret-for-testing-only-1234567890"
          NEXTAUTH_SECRET: "ci-secret-for-testing-only-1234567890"
          ENCRYPTION_KEY: "ci-encryption-key-32-bytes-long"
