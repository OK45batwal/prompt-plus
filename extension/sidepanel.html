<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt+ panel</title>
  <link rel="stylesheet" href="design-tokens.css">
  <style>
    :root {
      --bg: #0a0b10;
      --surface-1: rgba(12, 17, 30, 0.82);
      --surface-inner: rgba(0, 0, 0, 0.35);
      --border-subtle: rgba(255, 255, 255, 0.05);
      --border-highlight: rgba(255, 255, 255, 0.14);
      /* Same brand aliases as popup.html: indigo is declared once in design-tokens.css. */
      --accent-rgb: var(--brand-rgb);
      --accent-text: var(--brand-300);
      --border-active: rgba(var(--accent-rgb), 0.55);
      --primary: var(--brand-600);
      --primary-hover: var(--brand-500);
      --primary-deep: var(--brand-700);
      --text-white: #ffffff;
      --text-main: #ededf0;
      --text-muted: #9a9aa3;
      --text-dim: #6b6b74;
      --radius-outer: 11px;
      --radius-inner: 8px;
      --radius-pill: 9999px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    html, body {
      height: 100%;
      background: radial-gradient(700px 300px at 50% -60px, rgba(var(--accent-rgb), 0.08), transparent 70%), var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Keyboard users need to see where they are. */
    :focus-visible {
      outline: 2px solid var(--border-active);
      outline-offset: 2px;
      border-radius: 6px;
    }

    .header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 14px;
      background: rgba(16, 16, 19, 0.92);
      border-bottom: 1px solid var(--border-subtle);
    }

    .header-brand { display: flex; align-items: center; gap: 9px; min-width: 0; }

    .brand-mark {
      width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(135deg, var(--brand-500), var(--brand-700));
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 2px 10px rgba(var(--accent-rgb), 0.26);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .brand-mark svg { width: 19px; height: 19px; }

    .brand-name { font-size: 14px; font-weight: 800; color: var(--text-white); letter-spacing: -0.02em; }
    .brand-version { font-size: 10.5px; font-weight: 700; color: var(--accent-text); }

    .header-links { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .link-btn {
      display: inline-flex; align-items: center; gap: 5px;
      height: 28px; padding: 0 10px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 11.5px; font-weight: 600;
      text-decoration: none; cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .link-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--border-highlight); color: #fff; }
    .link-btn svg { width: 13px; height: 13px; }

    .main {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-label {
      font-size: 12px; font-weight: 600;
      color: var(--text-muted);
    }

    textarea#input {
      width: 100%;
      min-height: 180px;
      resize: vertical;
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-outer);
      padding: 11px 12px;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.55;
      user-select: text;
      -webkit-user-select: text;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }
    textarea#input:focus {
      outline: none;
      border-color: rgba(var(--accent-rgb), 0.5);
      box-shadow: 0 0 0 2px rgba(var(--accent-rgb), 0.2);
    }
    textarea#input::placeholder { color: var(--text-dim); }

    .counters {
      display: flex;
      justify-content: space-between;
      font-size: 10.5px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
      margin-top: -6px;
    }

    .tone-strip { display: flex; flex-wrap: wrap; gap: 6px; }

    .tone-pill-btn {
      padding: 5px 11px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      font-size: 11.5px; font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .tone-pill-btn:hover { background: rgba(255, 255, 255, 0.08); color: #fff; }
    .tone-pill-btn.active {
      background: rgba(var(--accent-rgb), 0.15);
      border-color: rgba(var(--accent-rgb), 0.45);
      color: var(--accent-text);
    }

    .engine-box {
      display: flex;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-inner);
      padding: 3px;
      gap: 3px;
    }
    .engine-tab {
      flex: 1; height: 30px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      border-radius: 6px; border: none; background: transparent;
      color: var(--text-muted); font-size: 11.5px; font-weight: 600;
      cursor: pointer; transition: all 0.15s ease;
    }
    .engine-tab.active {
      background: rgba(var(--accent-rgb), 0.25);
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      color: #ffffff;
    }
    /* The icons carry a viewBox but no intrinsic size, so they must be sized here
       or they expand to fill the flex row. */
    .engine-tab svg {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    .enhance-btn {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border-radius: 11px;
      border: 1px solid rgba(0, 0, 0, 0.25);
      background: linear-gradient(180deg, var(--brand-500) 0%, var(--brand-700) 100%);
      color: #ffffff;
      font-size: 13.5px; font-weight: 800; letter-spacing: -0.01em;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 3px 10px rgba(var(--accent-rgb), 0.16);
      transition: filter 0.15s ease, transform 0.15s ease;
    }
    .enhance-btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
    .enhance-btn:active:not(:disabled) { transform: translateY(1px) scale(0.995); }
    .enhance-btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .enhance-btn svg { width: 16px; height: 16px; }

    .status {
      font-size: 11.5px;
      color: var(--text-muted);
      min-height: 17px;
    }
    .status.err { color: #f87171; }

    .review-switch {
      display: flex; gap: 3px; padding: 3px;
      border-radius: 8px;
      background: var(--surface-inner);
      border: 1px solid var(--border-subtle);
    }
    .review-switch[hidden] { display: none; }
    .review-switch-btn {
      flex: 1; height: 30px; border: none; border-radius: 6px;
      background: transparent; color: var(--text-muted);
      font-size: 12px; font-weight: 700; cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .review-switch-btn:hover { color: var(--text-white); }
    .review-switch-btn.active { background: rgba(var(--accent-rgb), 0.22); color: var(--accent-text); }

    .output-card {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-outer);
      padding: 13px;
      font-size: 13px;
      line-height: 1.6;
      color: #ffffff;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 160px;
      overflow-wrap: anywhere;
      user-select: text;
      -webkit-user-select: text;
    }
    .output-card[hidden] { display: none; }

    .diff-pane {
      background: var(--surface-1);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-outer);
      padding: 13px;
      font-size: 13px;
      line-height: 1.6;
      color: #ffffff;
    }
    .diff-pane[hidden] { display: none; }
    .diff-label {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-dim); margin-bottom: 4px;
    }
    .diff-label + .diff-body { margin-bottom: 12px; }
    .diff-body { white-space: pre-wrap; overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
    /* Strikethrough/underline carry the meaning, so the diff never depends on colour alone. */
    .diff-body del { background: rgba(127, 29, 29, 0.85); color: #fecaca; text-decoration: line-through; border-radius: 3px; padding: 0 2px; }
    .diff-body ins { background: rgba(20, 83, 45, 0.9); color: #bbf7d0; text-decoration: underline; border-radius: 3px; padding: 0 2px; }

    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .action-btn {
      flex: 1 1 120px;
      height: 38px;
      border-radius: 8px;
      font-size: 12px; font-weight: 700;
      cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      transition: all 0.15s ease;
    }
    .action-btn svg { width: 14px; height: 14px; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-copy {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-highlight);
      color: #ffffff;
    }
    .btn-copy:hover:not(:disabled) { background: rgba(255, 255, 255, 0.1); }

    .btn-apply {
      background: var(--primary);
      border: 1px solid rgba(var(--accent-rgb), 0.5);
      color: #ffffff;
    }
    .btn-apply:hover:not(:disabled) { background: var(--primary-hover); }

    .footer-note { font-size: 10.5px; color: var(--text-dim); line-height: 1.45; }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="header-brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M22 90V28C22 16 32 10 52 10C72 10 85 22 85 40C85 58 72 68 52 68H42V90H22Z" fill="#ffffff"/>
          <path d="M26 68L56 38M56 38H42M56 38V52" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span>
        <span class="brand-name">Prompt+</span>
        <span class="brand-version" id="header-version-pill"></span>
      </span>
    </div>
    <div class="header-links">
      <a class="link-btn" id="studio-link" href="https://prompt-plus-three.vercel.app/dashboard" target="_blank" rel="noopener" title="Open the full web Studio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
        <span>Studio</span>
      </a>
    </div>
  </header>

  <main class="main">
    <label class="field-label" for="input">What do you want the AI to do?</label>
    <textarea id="input" placeholder="Paste or write the long draft here. Enhance prompt rewrites it; Changes shows exactly what moved."></textarea>
    <div class="counters">
      <span id="char-count">0 characters</span>
      <span id="token-estimate">~0 tokens</span>
    </div>

    <div class="tone-strip" role="group" aria-label="Tone">
      <button type="button" class="tone-pill-btn active" data-tone="human">Natural</button>
      <button type="button" class="tone-pill-btn" data-tone="code">Technical</button>
      <button type="button" class="tone-pill-btn" data-tone="exec">Executive</button>
      <button type="button" class="tone-pill-btn" data-tone="copy">Marketing</button>
      <button type="button" class="tone-pill-btn" data-tone="deep">Reasoning</button>
    </div>

    <div class="engine-box" role="group" aria-label="Engine">
      <button type="button" class="engine-tab active" id="mode-algo" aria-pressed="true" title="Runs instantly on this device. No network, no key.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        <span>Instant</span>
      </button>
      <button type="button" class="engine-tab" id="mode-api" aria-pressed="false" title="Runs on your saved API key. Needs a signed-in account.">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
        <span>Cloud key</span>
      </button>
    </div>

    <button type="button" class="enhance-btn" id="enhance-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      <span id="btn-text">Enhance prompt</span>
    </button>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="review-switch" id="review-switch" role="group" aria-label="Result view" hidden>
      <button type="button" class="review-switch-btn active" id="review-tab-output" aria-pressed="true">Output</button>
      <button type="button" class="review-switch-btn" id="review-tab-changes" aria-pressed="false">Changes</button>
    </div>

    <div class="diff-pane" id="diff-pane" hidden>
      <p class="diff-label">Original</p>
      <div class="diff-body" id="diff-before"></div>
      <p class="diff-label">Enhanced</p>
      <div class="diff-body" id="diff-after"></div>
    </div>

    <div class="output-card" id="output-body" hidden></div>

    <div class="actions">
      <button type="button" class="action-btn btn-copy" id="copy-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        <span id="copy-btn-label">Copy</span>
      </button>
      <button type="button" class="action-btn btn-apply" id="apply-btn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <span id="apply-btn-label">Apply to chat</span>
      </button>
    </div>

    <p class="footer-note">Prefer the quick popup? Click the Prompt+ toolbar icon. The Studio stays available from the header.</p>
  </main>

  <script src="lib/tokenizer.js"></script>
  <script src="lib/synthesize.js"></script>
  <script src="lib/diff.js"></script>
  <script src="sidepanel.js"></script>
</body>

</html>
