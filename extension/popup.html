<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prompt+ Extension</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 380px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #1e293b;
      overflow-x: hidden;
    }
    
    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .header-icon {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      box-shadow: 0 2px 8px rgba(37,99,235,0.25);
    }
    .header-info { display: flex; flex-direction: column; gap: 1px; }
    .header-title { font-size: 14px; font-weight: 700; color: #0f172a; letter-spacing: -0.02em; }
    .header-enc {
      font-size: 9px; font-weight: 700; color: #10b981;
      text-transform: uppercase; letter-spacing: 0.05em;
      display: flex; align-items: center; gap: 3px;
    }
    .enc-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: #10b981; box-shadow: 0 0 4px #10b981;
      display: inline-block;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; }
    }
    .key-badge {
      font-size: 10px; font-weight: 600;
      padding: 3px 8px; border-radius: 20px;
      background: #f1f5f9; border: 1px solid #e2e8f0;
      color: #64748b;
      display: flex; align-items: center; gap: 4px;
    }
    .key-badge.ok { color: #10b981; border-color: #a7f3d0; background: #ecfdf5; }

    /* Chatbot Counter Bar */
    .bots-strip {
      display: flex; gap: 6px;
      padding: 8px 18px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
    }
    .bot-pill {
      flex: 1;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 4px;
      border-radius: 8px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      font-size: 10px; font-weight: 600; color: #64748b;
      cursor: pointer; transition: all 0.15s;
    }
    .bot-pill:hover { background: #e2e8f0; }
    .bot-pill.active {
      background: #eff6ff;
      border-color: #93c5fd;
      color: #2563eb;
    }
    .bot-pill.active { background: #eff6ff; border-color: #93c5fd; color: #2563eb; }

    /* Content */
    .content { padding: 14px 18px; }
    textarea {
      width: 100%; height: 80px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      color: #1e293b;
      padding: 10px 12px;
      font-size: 13px; line-height: 1.5; font-family: inherit;
      resize: none; outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    textarea:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 2px rgba(59,130,246,0.12);
    }
    textarea::placeholder { color: #94a3b8; }

    .input-meta {
      display: flex; justify-content: space-between;
      margin-top: 4px; font-size: 10px; color: #94a3b8;
    }

    .model-select {
      width: 100%;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #1e293b;
      padding: 8px 10px;
      font-size: 12px; font-family: inherit;
      outline: none; cursor: pointer;
      margin-top: 10px;
    }
    .model-select optgroup { background: #f8fafc; color: #64748b; font-size: 11px; }
    .model-select option { background: #ffffff; color: #1e293b; }

    .btn-enhance {
      width: 100%; padding: 11px;
      border: none; border-radius: 10px;
      font-size: 13px; font-weight: 700;
      cursor: pointer; transition: all 0.15s;
      margin-top: 10px;
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: #ffffff;
      box-shadow: 0 2px 10px rgba(37,99,235,0.25);
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-family: inherit;
    }
    .btn-enhance:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn-enhance:active { transform: translateY(0); }
    .btn-enhance:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .msg {
      font-size: 11px; display: none;
      align-items: center; gap: 4px; margin-top: 8px;
      padding: 6px 10px; border-radius: 8px;
    }
    .msg.ok { color: #10b981; background: #ecfdf5; border: 1px solid #a7f3d0; }
    .msg.err { color: #ef4444; background: #fef2f2; border: 1px solid #fecaca; }

    .api-card {
      margin-top: 12px; padding: 10px 12px;
      background: #ffffff; border-radius: 10px;
      border: 1px solid #e2e8f0;
    }
    .api-label {
      font-size: 10px; font-weight: 700;
      color: #64748b; text-transform: uppercase;
      letter-spacing: 0.04em; margin-bottom: 6px;
    }
    .api-card input {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      color: #1e293b;
      padding: 7px 10px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      outline: none;
    }
    .api-card input:focus { border-color: #3b82f6; }

    .footer {
      padding: 10px 18px;
      border-top: 1px solid #e2e8f0;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 11px; color: #94a3b8;
      background: #ffffff;
    }
    .footer strong { color: #3b82f6; }
    .footer a { color: #2563eb; text-decoration: none; font-weight: 600; }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">⚡</div>
      <div class="header-info">
        <div class="header-title">Prompt+ Intelligence</div>
        <div class="header-enc"><span class="enc-dot"></span> SECURE</div>
      </div>
    </div>
    <div class="key-badge" id="key-indicator">
      <span id="key-text">No Key</span>
    </div>
  </div>

  <!-- Chatbot Counter Bar -->
  <div class="bots-strip">
    <div class="bot-pill active" id="tab-chatgpt">
      <span>🤖</span>
      <span>ChatGPT</span>
    </div>
    <div class="bot-pill" id="tab-claude">
      <span>🟣</span>
      <span>Claude</span>
    </div>
    <div class="bot-pill" id="tab-gemini">
      <span>✨</span>
      <span>Gemini</span>
    </div>
    <div class="bot-pill" id="tab-deepseek">
      <span>⚡</span>
      <span>DeepSeek</span>
    </div>
  </div>

  <!-- Content -->
  <div class="content">
    <textarea id="input" placeholder="Paste or type your prompt to enhance..."></textarea>
    <div class="input-meta">
      <span id="char-count">0 characters</span>
    </div>

    <select id="model-select" class="model-select">
      <optgroup label="OpenRouter Free Tier">
        <option value="meta-llama/llama-3.3-70b-instruct:free::openrouter" selected>Llama 3.3 70B (Free)</option>
        <option value="google/gemini-2.0-flash-exp:free::openrouter">Gemini 2.0 Flash (Free)</option>
        <option value="deepseek/deepseek-r1:free::openrouter">DeepSeek R1 (Free)</option>
        <option value="qwen/qwen-2.5-coder-32b-instruct:free::openrouter">Qwen 2.5 Coder (Free)</option>
      </optgroup>
      <optgroup label="Direct API Keys">
        <option value="gpt-4o-mini::openai">GPT-4o Mini</option>
        <option value="gpt-4o::openai">GPT-4o</option>
        <option value="claude-3-5-sonnet-20241022::anthropic">Claude 3.5 Sonnet</option>
      </optgroup>
    </select>

    <button class="btn-enhance" id="enhance-btn">
      <span>⚡</span>
      <span>Apply Upgrade</span>
      <span>→</span>
    </button>
    <div class="msg" id="msg"></div>

    <div class="api-card">
      <div class="api-label">API Key Vault</div>
      <input type="password" id="key-input" placeholder="sk-or-... or sk-... or sk-ant-..." />
    </div>
  </div>

  <div class="footer">
    <span>Optimized by <strong>Prompt+</strong></span>
    <a href="#" id="open-dash">Dashboard →</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
