name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  AUTH_SECRET: "ci-auth-secret-32-characters-minimum-for-testing!"
  NEXTAUTH_SECRET: "ci-auth-secret-32-characters-minimum-for-testing!"
  ENCRYPTION_KEY: "ci-encryption-key-32-characters-minimum-for-testing!"

jobs:
  # ─── Job 1: Lint & Typecheck (Fast Feedback) ──────────────────────────────
  lint-and-typecheck:
    name: 🧹 Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

  # ─── Job 2: Security & Route Verification ────────────────────────────────
  security-gate:
    name: 🛡️ Security Gate & Route Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify API Route Security & CSRF Guards
        run: node scripts/check-api-routes.mjs

      - name: Check Environment Variable Contract
        run: node scripts/check-env.mjs
        env:
          AUTH_SECRET: "ci-auth-secret-32-characters-minimum-for-testing!"
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          RESEND_API_KEY: "re_ci_dummy_key_for_testing"
          SMTP_FROM: "noreply@prompt-plus.com"

  # ─── Job 3: Unit & Integration Test Suite ────────────────────────────────
  test-suite:
    name: 🧪 Unit & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Vitest Test Suite
        run: npm test

  # ─── Job 4: Next.js Production Build ──────────────────────────────────────
  production-build:
    name: 🚀 Production Build
    needs: [lint-and-typecheck, security-gate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Production Bundle
        run: npm run build
