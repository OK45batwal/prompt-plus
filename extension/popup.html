<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prompt+</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
    }
    .h { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .h-l { display: flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 700; }
    .h-icon { width: 20px; height: 20px; border-radius: 6px; background: linear-gradient(135deg,#6366f1,#8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; color: #fff; }
    .h-s { font-size: 11px; color: #10b981; display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .c { padding: 12px 14px; }
    textarea {
      width: 100%;
      height: 80px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      color: #f1f5f9;
      padding: 10px;
      font-size: 13px;
      line-height: 1.5;
      font-family: inherit;
      resize: none;
      outline: none;
    }
    textarea:focus { border-color: rgba(99,102,241,0.4); }
    textarea::placeholder { color: #475569; }
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      margin-top: 8px;
      background: linear-gradient(135deg,#6366f1,#8b5cf6);
      color: #fff;
    }
    .btn:hover { filter: brightness(1.1); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .api {
      margin-top: 10px;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.06);
    }
    .api input {
      width: 100%;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      color: #f1f5f9;
      padding: 7px 10px;
      font-size: 12px;
      font-family: monospace;
      outline: none;
    }
    .api input:focus { border-color: rgba(99,102,241,0.4); }
    .api-l { font-size: 10px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 5px; display: flex; align-items: center; gap: 4px; }
    .api-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
    .api-dot.ok { background: #10b981; }
    .api-dot.no { background: #f87171; }
    .f { padding: 8px 14px; border-top: 1px solid rgba(255,255,255,0.06); text-align: center; font-size: 10px; color: #475569; }
    .f a { color: #6366f1; text-decoration: none; }
    .msg { font-size: 11px; color: #10b981; display: none; align-items: center; gap: 4px; margin-top: 6px; }
    .msg.err { color: #f87171; }
    .model-select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      color: #e2e8f0;
      padding: 7px 10px;
      font-size: 12px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      margin-top: 8px;
    }
    .model-select:focus { border-color: rgba(99,102,241,0.4); }
    .model-select optgroup { background: #1e293b; color: #94a3b8; font-size: 11px; }
    .model-select option { background: #0f172a; color: #e2e8f0; }
    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.15); border-top-color: #fff; border-radius: 50%; animation: s 0.6s linear infinite; vertical-align: middle; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="h">
    <div class="h-l"><div class="h-icon">P</div> Prompt+</div>
    <div class="h-s" id="key-indicator">• No Key</div>
  </div>
  <div class="c">
    <textarea id="input" placeholder="Paste prompt to enhance..."></textarea>
    <select id="model-select" class="model-select">
      <optgroup label="OpenRouter Free">
        <option value="meta-llama/llama-3.3-70b-instruct:free::openrouter" selected>Llama 3.3 70B</option>
        <option value="google/gemini-2.0-flash-exp:free::openrouter">Gemini 2.0 Flash</option>
        <option value="deepseek/deepseek-r1:free::openrouter">DeepSeek R1</option>
        <option value="qwen/qwen-2.5-coder-32b-instruct:free::openrouter">Qwen 2.5 Coder</option>
      </optgroup>
      <optgroup label="Paid">
        <option value="gpt-4o-mini::openai">GPT-4o Mini</option>
        <option value="gpt-4o::openai">GPT-4o</option>
        <option value="claude-3-5-sonnet-20241022::anthropic">Claude 3.5 Sonnet</option>
      </optgroup>
    </select>
    <button class="btn" id="enhance-btn">Enhance</button>
    <div class="msg" id="msg"></div>
    <div class="api">
      <div class="api-l"><span class="api-dot no" id="key-dot"></span> API Key</div>
      <input type="password" id="key-input" placeholder="sk-... or sk-ant-..." />
    </div>
  </div>
  <div class="f">
    Side panel available on ChatGPT, Claude & Gemini &middot; <a href="#" id="open-dash">Dashboard</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
