<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Prompt+ Sentry Assistant</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .title {
      font-size: 14px;
      font-weight: 700;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      font-size: 10px;
      background: #10b981;
      color: #ffffff;
      padding: 2px 6px;
      border-radius: 10px;
      font-weight: 600;
    }
    textarea {
      width: 100%;
      height: 70px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #f8fafc;
      padding: 8px;
      font-size: 12px;
      box-sizing: border-box;
      resize: none;
      margin-bottom: 10px;
    }
    textarea:focus {
      outline: none;
      border-color: #6366f1;
    }
    button {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 10px;
    }
    button:hover {
      filter: brightness(1.1);
    }
    .output-box {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
      display: none;
    }
    .footer {
      font-size: 10px;
      color: #94a3b8;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Prompt+ Sentry</div>
    <div class="badge">ACTIVE</div>
  </div>

  <label style="font-size: 11px; color: #94a3b8; display: block; margin-bottom: 4px;">Quick Prompt Optimizer</label>
  <textarea id="quick-input" placeholder="Type prompt to enhance..."></textarea>
  <button id="enhance-btn">Optimize & Copy</button>

  <div id="output" class="output-box"></div>

  <div class="footer">
    Connected to Prompt+ Engine • <a href="http://localhost:3000" target="_blank" style="color: #38bdf8;">Dashboard</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
